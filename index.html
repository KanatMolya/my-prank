<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Секретный сюрприз</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 350px;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #128C7E;
        }
        .hidden {
            display: none;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        h2 {
            color: #333;
        }
    </style>
</head>
<body>

    <!-- Аудио элемент -->
    <audio id="donkey-sound" src="sound.mp3" preload="auto"></audio>

    <!-- ЭКРАН 1: Ввод имени -->
    <div id="step1" class="card">
        <h2>Привет мой друг! 👋</h2>
        <p>Твое имя?</p>
        <input type="text" id="username" placeholder="Ваше имя..." autocomplete="off">
        <br>
        <button onclick="nextStep()">Перейти</button>
    </div>

    <!-- ЭКРАН 2: Осел и пранк -->
    <div id="step2" class="card hidden">
        <img src="donkey.jpg" alt="Осел">
        <h2 id="prank-text">не будь послушным как я !)))</h2>
    </div>

    <script>
        function nextStep() {
            const name = document.getElementById('username').value.trim();
            if (name === "") {
                alert("Пожалуйста, введи имя!");
                return;
            }

            // Запуск аудиозаписи
            const audio = document.getElementById('donkey-sound');
            audio.play().catch(error => {
                console.log("Ошибка воспроизведения звука:", error);
            });

            // Обращение по имени на финальном экране
            document.getElementById('prank-text').innerText = `${name}, не будь послушным как я !)))`;
            
            // Прячем форму и показываем картинку
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }
    </script>
</body>
</html>
